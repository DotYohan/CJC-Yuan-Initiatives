services:
  - type: web
    name: cjc-student-portal
    runtime: node
    plan: free
    region: singapore
    branch: feature/student-program-workflow
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run init:prod && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CJC_AUDIT_PEPPER
        generateValue: true
