services:
  - type: web
    name: cjc-student-portal
    runtime: node
    plan: free
    region: singapore
    branch: feature/student-program-workflow
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run init:prod && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: cjc-database
          property: connectionString
      - key: CJC_AUDIT_PEPPER
        generateValue: true

databases:
  - name: cjc-database
    plan: free
    region: singapore
    databaseName: cor_jesu_sms
    user: cjc_app
